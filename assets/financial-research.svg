<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title"><title id="title">Financial Research — Read the report. Trace the evidence.</title><defs>
<radialGradient id="glow"><stop stop-color="#183c87" stop-opacity=".8"/><stop offset="1" stop-color="#070b18" stop-opacity="0"/></radialGradient>
<linearGradient id="spectrum"><stop stop-color="#438cff"/><stop offset=".5" stop-color="#ff69c8"/><stop offset="1" stop-color="#91b5ff"/></linearGradient>
<linearGradient id="fade"><stop stop-color="#438cff" stop-opacity="0"/><stop offset="1" stop-color="#438cff" stop-opacity=".8"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#25354b" stroke-width=".5"/></pattern>
</defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;letter-spacing:1.7px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes reverse{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes travel{0%{transform:translate(0,0);opacity:0}12%,88%{opacity:1}100%{transform:translate(var(--tx),var(--ty));opacity:0}}
@keyframes draw{0%{stroke-dashoffset:var(--length)}65%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:var(--length)}}
@media(prefers-reduced-motion:reduce){.motion{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style><rect x="1" y="1" width="998" height="298" rx="24" fill="#070b18" stroke="#273650" /><text x="36" y="38" fill="#ff69c8" font-size="11" font-weight="600" class="mono">FINANCIAL NLP / RESEARCH</text><text x="36" y="86" fill="#eef5ff" font-size="39" font-weight="700" >Financial Research</text><text x="36" y="130" fill="#aabbd5" font-size="23" font-weight="400" >Read the report.</text><text x="36" y="162" fill="#aabbd5" font-size="23" font-weight="400" >Trace the evidence.</text><text x="36" y="218" fill="#aabbd5" font-size="14" font-weight="400" >PyTorch / LoRA / FastAPI / Retrieval</text><text x="36" y="266" fill="#ff69c8" font-size="11" font-weight="600" class="mono">EXPLORE RESEARCH ↗</text><path d="M607 34 L607 266" fill="none" stroke="#273650" stroke-width="1" /><g transform="translate(650 48) scale(1)"><text x="0" y="10" fill="#aabbd5" font-size="10" font-weight="500" class="mono">REPORT → RETRIEVE → CITE</text><rect x="8" y="46" width="82" height="118" rx="7" fill="#070b18" stroke="#273650" /><rect x="18" y="36" width="82" height="118" rx="7" fill="#070b18" stroke="#ff69c8" /><text x="30" y="57" fill="#aabbd5" font-size="9" font-weight="600" class="mono">REPORT</text><path d="M30 72 L82 72" fill="none" stroke="#273650" stroke-width="3" /><path d="M30 87 L70 87" fill="none" stroke="#273650" stroke-width="3" /><path d="M30 102 L84 102" fill="none" stroke="#273650" stroke-width="3" /><path d="M30 117 L62 117" fill="none" stroke="#273650" stroke-width="3" /><g class="motion" style="--tx:0px;--ty:60px;animation:travel 6s linear infinite;animation-delay:-0s"><rect x="25" y="65" width="68" height="19" rx="2" fill="#ff69c8" stroke="none" opacity=".15"/></g><path d="M108 96 L168 96" fill="none" stroke="#273650" stroke-width="1.5" /><g class="motion" style="--tx:55px;--ty:0px;animation:travel 6s linear infinite;animation-delay:-0s"><circle cx="109" cy="96" r="3" fill="#ff69c8" stroke="none" /></g><g class="motion" style="--tx:55px;--ty:0px;animation:travel 6s linear infinite;animation-delay:-2s"><circle cx="109" cy="96" r="3" fill="#ff69c8" stroke="none" /></g><g class="motion" style="--tx:55px;--ty:0px;animation:travel 6s linear infinite;animation-delay:-4s"><circle cx="109" cy="96" r="3" fill="#ff69c8" stroke="none" /></g><rect x="178" y="36" width="140" height="128" rx="9" fill="#0c1426" stroke="#273650" /><text x="191" y="57" fill="#aabbd5" font-size="9" font-weight="500" class="mono">SOURCE EVIDENCE</text><path d="M192 77 L290 77" fill="none" stroke="#273650" stroke-width="3" /><path d="M192 77 L290 77" fill="none" stroke="#ff69c8" stroke-width="3" class="motion draw" stroke-dasharray="98" style="--length:98;animation:draw 6s ease-in-out infinite;animation-delay:-0.0s"/><path d="M192 99 L271 99" fill="none" stroke="#273650" stroke-width="3" /><path d="M192 99 L271 99" fill="none" stroke="#ff69c8" stroke-width="3" class="motion draw" stroke-dasharray="79" style="--length:79;animation:draw 6s ease-in-out infinite;animation-delay:-0.7s"/><path d="M192 121 L284 121" fill="none" stroke="#273650" stroke-width="3" /><path d="M192 121 L284 121" fill="none" stroke="#ff69c8" stroke-width="3" class="motion draw" stroke-dasharray="92" style="--length:92;animation:draw 6s ease-in-out infinite;animation-delay:-1.4s"/><g class="motion" style="animation:pulse 5s ease-in-out infinite;animation-delay:-0s"><rect x="274" y="137" width="30" height="17" rx="4" fill="#070b18" stroke="#ff69c8" /><text x="280" y="149" fill="#ff69c8" font-size="10" font-weight="600" >[1]</text></g><text x="0" y="200" fill="#aabbd5" font-size="8" font-weight="400" class="mono">ILLUSTRATIVE DOCUMENT WORKFLOW</text></g><rect x="36" y="13" width="50" height="2" rx="1" fill="#ff69c8" stroke="none" /></svg>